name: Build SleepMute APKs

# Se lance quand tu cliques sur "Run workflow" dans l'onglet Actions,
# ou automatiquement à chaque modification du code.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler les deux applications
        run: gradle :mobile:assembleDebug :wear:assembleDebug

      - name: Publier les APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: sleepmute-apks
          path: |
            mobile/build/outputs/apk/debug/mobile-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
